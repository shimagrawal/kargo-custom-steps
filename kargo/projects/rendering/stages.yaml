# Stages for the rendering demo. Names say what to expect:
#   jsonnet-render-pass  jsonnet-render (custom step) renders the guestbook app
#                        with the Freight's image tag -> passes; see the `render`
#                        and `rendered` outputs
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: jsonnet-render-pass
  namespace: custom-steps-rendering
  labels:
    kargo.akuity.io/shard: self-hosted
  annotations:
    kargo.akuity.io/color: green
spec:
  shard: self-hosted
  requestedFreight:
  - origin:
      kind: Warehouse
      name: guestbook
    sources:
      direct: true
  promotionTemplate:
    spec:
      steps:
      - task:
          name: jsonnet-render
