# What a promotion changes in the rendered manifests of the Go demo cdk8s
# app. The cdk8s-synth-go custom step renders the app twice: with the image this
# Stage runs now (stored on the Stage with set-metadata, read back with
# stageMetadata()) and with the Freight's image. The manifest-diff custom step
# then shows the difference. Both renders use the app code from main, so the
# diff shows what the Freight changes.
#
# appPath picks the app: the blocked Stage points it at a copy with a type
# error, so the first render fails and blocks the promotion.
apiVersion: kargo.akuity.io/v1alpha1
kind: PromotionTask
metadata:
  name: cdk8s-synth-go
  namespace: custom-steps-rendering
spec:
  vars:
  - name: repoURL
    value: https://github.com/shimagrawal/kargo-custom-steps.git
  - name: image
    value: ghcr.io/akuity/guestbook
  - name: appPath
    value: ./src/demo-fixtures/cdk8s-synth/go
  steps:
  - uses: git-clone
    config:
      repoURL: ${{ vars.repoURL }}
      checkout:
      - branch: main
        path: ./src
  # What this Stage runs now. On its first promotion nothing is stored yet, so
  # it renders the Freight's image and the diff is empty.
  - uses: cdk8s-synth-go
    as: render-current
    config:
      path: ${{ vars.appPath }}
      outPath: ./out/current
      env:
        ENVIRONMENT: prod
        IMAGE: ${{ stageMetadata(ctx.stage)?.lastImage ?? (vars.image + ":" + imageFrom(vars.image).Tag) }}
  # What this promotion deploys.
  - uses: cdk8s-synth-go
    as: render-new
    config:
      path: ${{ vars.appPath }}
      outPath: ./out/new
      env:
        ENVIRONMENT: prod
        IMAGE: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
  - uses: manifest-diff
    as: diff
    config:
      from: ./out/current
      to: ./out/new
  # Remember what this Stage now runs, for the next promotion's diff.
  - uses: set-metadata
    config:
      updates:
      - kind: Stage
        name: ${{ ctx.stage }}
        values:
          lastImage: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
