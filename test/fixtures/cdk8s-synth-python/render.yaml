description: renders the Python demo app with per-Stage settings from env
config:
  path: ./src/python
  outPath: ./out
  env:
    ENVIRONMENT: prod
files:
  src: demo-fixtures/cdk8s-synth
expect:
  status: Succeeded
  output:
    language: python
    outPath: ./out
    count: 2
    files: [out/guestbook.k8s.yaml]
    resources:
    - {kind: Deployment, name: guestbook-ui, namespace: ""}
    - {kind: Service, name: guestbook-ui, namespace: ""}
    error: ""
